<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Narayan Adhude Portfolio</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <style>
    :root {
      --primary: #4F46E5;
      --primary-dark: #3730A3;
      --gradient: linear-gradient(135deg, #4F46E5, #7C3AED);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #EEF2FF 0%, #F0F9FF 50%, #F5F3FF 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-mark {
      width: 64px;
      height: 64px;
      background: var(--gradient);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      color: #fff;
      box-shadow: 0 8px 25px rgba(79, 70, 229, 0.35);
      margin-bottom: 14px;
    }

    .login-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.7rem;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 4px;
    }

    .login-sub {
      color: #64748B;
      font-size: 0.88rem;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 36px 36px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .form-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .form-control {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 12px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      color: #0F172A;
      transition: all 0.25s ease;
    }

    .form-control:focus {
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      outline: none;
    }

    .input-group-text {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-right: none;
      color: #94A3B8;
      border-radius: 10px 0 0 10px;
    }

    .input-group .form-control {
      border-left: none;
      border-radius: 0 10px 10px 0;
    }

    .input-group .form-control:focus+.input-group-text,
    .input-group-text:focus {
      border-color: var(--primary);
    }

    .btn-login {
      background: var(--gradient);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(79, 70, 229, 0.35);
      transition: all 0.25s ease;
      letter-spacing: 0.01em;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(79, 70, 229, 0.45);
    }

    .alert {
      border-radius: 10px;
      font-size: 0.85rem;
    }

    .back-link {
      text-align: center;
      margin-top: 22px;
    }

    .back-link a {
      color: #64748B;
      font-size: 0.83rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link a:hover {
      color: var(--primary);
    }

    .security-badge {
      text-align: center;
      margin-top: 20px;
      font-size: 0.72rem;
      color: #94A3B8;
      letter-spacing: 0.04em;
    }

    .security-badge i {
      color: #10B981;
      margin-right: 4px;
    }
  </style>
</head>

<body>
  <div class="login-wrapper">
    <div class="login-logo">
      <div class="logo-mark">NA</div>
      <h1 class="login-title">Admin Portal</h1>
      <p class="login-sub">Portfolio Management Dashboard</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for cat, msg in messages %}
    <div class="alert alert-{{ 'success' if cat == 'success' else 'danger' }} alert-dismissible fade show mb-3"
      role="alert">
      <i class="fas fa-{{ 'check-circle' if cat == 'success' else 'exclamation-circle' }} me-2"></i>{{ msg }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <div class="login-card">
      <form method="POST" action="{{ url_for('admin_login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="mb-3">
          <label class="form-label"><i class="fas fa-user me-1"></i>Username</label>
          <input type="text" name="username" class="form-control" placeholder="Enter your username" required
            autofocus />
        </div>
        <div class="mb-4">
          <label class="form-label"><i class="fas fa-lock me-1"></i>Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn-login">
          <i class="fas fa-sign-in-alt me-2"></i>Sign In to Dashboard
        </button>
      </form>
    </div>

    <div class="back-link">
      <a href="{{ url_for('index') }}"><i class="fas fa-arrow-left me-1"></i>Back to Portfolio</a>
    </div>
    <div class="security-badge">
      <i class="fas fa-shield-alt"></i>Secured with Flask-Login
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
